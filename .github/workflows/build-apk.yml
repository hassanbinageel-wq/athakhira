name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: student-app
        run: npm install

      - name: Add Android platform
        working-directory: student-app
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: student-app
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: student-app
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: student-app/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp student-app/android/app/build/outputs/apk/debug/app-debug.apk output/athakhira-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athakhira-apk
          path: output/*.apk
          retention-days: 30
          - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icons
        run: npx @capacitor/assets generate --android || echo "icon generation skipped"

      - name: Sync Capacitor
        run: npx cap sync android
