name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Inject microphone permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' "$MANIFEST"
              echo "✓ Added RECORD_AUDIO permission"
            fi
            echo "===== Manifest permissions ====="
            grep "uses-permission" "$MANIFEST"
          fi

      - name: Storage permission for saving the book (Android 10 and older)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application android:requestLegacyExternalStorage="true"|' "$MANIFEST"
            echo "✓ Added storage permission"
          fi
          grep -n "uses-permission\|<application" "$MANIFEST"

      - name: Green system bars background (edge-to-edge)
        run: |
          RES="android/app/src/main/res/values"
          STYLES="$RES/styles.xml"
          if [ -f "$STYLES" ] && ! grep -q "athakhira_bars" "$STYLES"; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="athakhira_bars">#0d3b2e</color>\n</resources>\n' > "$RES/athakhira_colors.xml"
            sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item>\n        <item name="android:windowBackground">@color/athakhira_bars</item>\n        <item name="android:windowLightStatusBar">false</item>|' "$STYLES"
            echo "✓ System bars background set"
          fi
          cat "$STYLES"

      - name: Generate app icons
        run: npx @capacitor/assets generate --android || echo "icon generation skipped"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk athakhira-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: athakhira-v2-apk
          path: student-app/athakhira-v2.apk
